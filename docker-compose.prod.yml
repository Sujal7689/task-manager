# Standalone production compose file — do NOT combine with docker-compose.yml
# via multiple -f flags: Docker Compose concatenates list fields (ports,
# volumes) across merged files rather than replacing them, which would leave
# both files' port mappings applied at once (including Postgres's, which
# this file deliberately does not publish). Run this file by itself instead:
#
#   docker compose --env-file .env --env-file .image_tag.env -f docker-compose.prod.yml up -d
#
# TLS/domain routing is handled by nginx already running on the host, NOT by
# a container here — backend and frontend each publish straight to
# 127.0.0.1 (no extra proxy container in between), and the host's own nginx
# reverse-proxies the public domain to those two local ports (see README for
# the host nginx server-block example). Postgres's port isn't published to
# the host at all.
#
# backend/frontend are pulled as pre-built images from GHCR (built by CI) —
# this file never builds from source, so the server only ever needs this
# file and .env. IMAGE_OWNER/IMAGE_TAG come from .image_tag.env, written by
# the deploy workflow; default to "latest" for manual runs.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${IMAGE_OWNER}/task-manager-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    image: ghcr.io/${IMAGE_OWNER}/task-manager-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
