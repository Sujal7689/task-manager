server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path that isn't a real file (e.g. /tasks/123, /login,
    # /admin) falls through to index.html so React Router can handle it
    # client-side. Without this, a direct navigation or page refresh on any
    # nested route 404s at the nginx level; this was previously only masked
    # by the PWA service worker's own navigation fallback, which isn't active
    # on a first visit, in private browsing, or after a cache clear.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
